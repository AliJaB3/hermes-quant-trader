[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-quant-trader"
version = "0.1.0"
description = "Proposer-guardian paper trading system"
requires-python = ">=3.10"

[project.scripts]
hermes-trader = "hermes_trader.cli:main"

[tool.setuptools.packages.find]
include = ["hermes_trader*"]

[tool.pytest.ini_options]
pythonpath = ["."]
